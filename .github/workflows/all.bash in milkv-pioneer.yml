name: all.bash in milkv-pioneer
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-toolchain-in-milkv-pioneer:
    runs-on: milkv-pioneer
    timeout-minutes: 240

    # =====================================================================
    # 实验说明（ASAN 交叉验证 —— 第二阶段：纯 C 最小复现的对照组）
    #
    # 背景：TestASAN/asan2_fail 在 RISE runner 上挂死，而在本 runner 上
    #       all.bash 能正常通过。第一阶段的日志把失败点定位到 libasan：
    #   ErrorGeneric::Print -> stack.Print -> SymbolizePC（持有 mu_）
    #     -> FindModuleForAddress -> RefreshModules -> procmapsInit
    #     -> MemoryLayout::Next 的 CHECK_EQ(*data_.current++, '-') 失败
    #   CheckFailed -> CheckUnwind -> stack.Print -> SymbolizePC
    #     -> 再次 Lock(&mu_) -> 自死锁，进程永远退不出去。
    #
    # 本 workflow 的作用是**对照**：在同一份纯 C 复现程序上，本板能否
    # 复现。若本板 0 次失败、RISE 高概率失败，就能把变量收敛到
    # “内核 / 核数 / VMA 变动频率”，而不是代码差异。
    #
    # 本阶段实验：
    #   0)  checkout
    #   1)  确保 C 工具链可用
    #   2)  打印环境指纹
    #   3)  纯 C ASAN 对照（普通插桩路径，单线程，应正常）
    #   4)  纯 C ASAN 对照（复刻 __asan_report_error 入口，单线程，应正常）
    #   11) 编译纯 C 最小复现程序（pthread + mmap/munmap churn）
    #   12) 复现实验：无 churn 对照组
    #   13) 复现实验：mmap/munmap churn
    #   14) 复现实验：线程创建/销毁 churn
    #   15) 复现实验：两种 churn 叠加
    #   9)  汇总关键结果
    #   10) 上传日志
    #
    # 实验 5-8（下载官方 Go / make.bash / asan2_fail）本阶段整体注释停用，
    # 目的是把有限的板子时间全部用在纯 C 复现上；需要时取消注释即可。
    # 本板较慢，每个用例的重复次数比 RISE 少。
    #
    # 注意：实验期间统一使用 GORISCV64=rva20u64。
    #       misaligned_fast 是本 fork 私有扩展（commit 3f61bcf10c），
    #       官方 Go 不识别；为了让两台机器、两套工具链的对照成立，
    #       这里也不使用它。
    #
    # 旧的 all.bash 流程没有删除，整体注释在下方 steps 开头。
    # =====================================================================
    env:
      GORISCV64: rva20u64
      # TestASAN 在 riscv64 上的跳过开关（见 asan_test.go 的 TestASAN）。
      # 本板实际不会触发问题，但保持与 RISE 一致的配置，避免两边行为
      # 不可比。该变量只在跑 all.bash / go test 时生效。
      GOTEST_SKIP_ASAN: "1"

    steps:
      # ===================================================================
      # 旧流程（整体注释保留，实验结束后取消注释即可恢复）
      # ===================================================================
      # - uses: actions/checkout@v4
      #   with:
      #     fetch-depth: 0
      #
      # - name: Ensure C toolchain is available
      #   run: |
      #       set -euxo pipefail
      #       if ! command -v gcc >/dev/null 2>&1; then
      #         sudo apt-get update
      #         sudo apt-get install -y --no-install-recommends gcc libc6-dev
      #       fi
      #       gcc --version
      #
      # - name: Build toolchain (host riscv64)
      #   run: |
      #       # install bootstrap Go
      #       set -euxo pipefail
      #       BOOT=/tmp/go-bootstrap
      #       rm -rf "$BOOT"
      #       curl -fsSL https://github.com/zte-riscv/go/releases/download/go1.26.4.202607/go1.26.4.202607.linux-riscv64.tar.gz -o /tmp/go.tar.gz
      #       tar -C /tmp -xzf /tmp/go.tar.gz
      #       mv /tmp/go "$BOOT"
      #       export GOROOT_BOOTSTRAP="$BOOT"
      #       export GORISCV64=rva20u64
      #       export GO_TEST_TIMEOUT_SCALE=10
      #
      #       # build toolchain
      #       cd "$GITHUB_WORKSPACE/src"
      #       rm -f "$GITHUB_WORKSPACE/VERSION"
      #       ./all.bash
      # ===================================================================

      # ===================================================================
      # 实验 0：检出代码
      # ===================================================================
      - name: "实验 0: checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ===================================================================
      # 实验 1：确保 C 工具链可用
      #
      # ASAN 的 -fsanitize=address 需要 gcc 和 libasan；缺少 gcc 时，
      # 后面的 C 对照和 go build -asan 都无法执行。
      # ===================================================================
      - name: "实验 1: 确保 C 工具链可用"
        run: |
          set -euxo pipefail
          if ! command -v gcc >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gcc libc6-dev
          fi
          gcc --version

      # ===================================================================
      # 实验 2：打印环境指纹
      #
      # 重点记录 gcc / libasan / glibc 版本和内核信息。ASAN 的行为主要
      # 由 libasan（随 gcc 安装）决定，而不是由发行版名字决定。
      # ===================================================================
      - name: "实验 2: 打印环境指纹"
        run: |
          set -x
          mkdir -p "$GITHUB_WORKSPACE/asan-logs"
          LOG="$GITHUB_WORKSPACE/asan-logs/00-env.log"
          {
            echo "===== uname ====="
            uname -a || true
            echo "===== /etc/os-release ====="
            cat /etc/os-release || true
            echo "===== gcc --version ====="
            gcc --version || true
            echo "===== ld --version (glibc) ====="
            ld --version | head -1 || true
            echo "===== libasan path ====="
            gcc -print-file-name=libasan.so || true
            echo "===== libasan realpath ====="
            readlink -f "$(gcc -print-file-name=libasan.so)" || true
            echo "===== libasan/gcc packages ====="
            dpkg-query -W -f='${Package} ${Version}\n' 'libasan*' 'gcc*' 2>/dev/null || true
            echo "===== cpu / mem / limits ====="
            nproc
            free -h
            ulimit -a
            echo "===== vm.overcommit_memory ====="
            cat /proc/sys/vm/overcommit_memory || true
            echo "===== cpu mmu ====="
            grep -m1 -i 'mmu' /proc/cpuinfo || true
            echo "===== GORISCV64 ====="
            echo "${GORISCV64:-unset}"
            echo "===== symbolizers ====="
            command -v llvm-symbolizer addr2line || true
          } 2>&1 | tee "$LOG"

      # ===================================================================
      # 实验 3：纯 C ASAN 对照（普通插桩路径）
      #
      # 复刻 asan2_fail 的越界模式：malloc(20) 之后访问第 20 字节，
      # 即“部分可用格子 + 右红区”。gcc 会插入内联检查并调用
      # __asan_report_store4，用来判断本机 libasan 的报告路径是否正常。
      #
      # 判读：
      #   exit=1   正常打印 heap-buffer-overflow（libasan 正常）
      #   exit=137 被 timeout 杀掉（libasan 报告路径挂死）
      # ===================================================================
      - name: "实验 3: 纯 C ASAN 对照（普通插桩路径）"
        continue-on-error: true
        run: |
          set -euxo pipefail
          LOG="$GITHUB_WORKSPACE/asan-logs/01-c-normal.log"
          printf '%s\n' \
            '#include <stdlib.h>' \
            'int main(void) {' \
            '    int *p = malloc(5 * sizeof(int));' \
            '    int *q = (int *)((char *)p + 20);  /* 部分可用格子 + 右红区 */' \
            '    *q = 100;' \
            '    return 0;' \
            '}' > /tmp/asan-c-normal.c
          gcc -fsanitize=address -g -O0 /tmp/asan-c-normal.c -o /tmp/asan-c-normal
          set +e
          timeout -s KILL 120 /tmp/asan-c-normal > "$LOG" 2>&1
          code=$?
          set -e
          echo "exit=$code" | tee -a "$LOG"

      # ===================================================================
      # 实验 4：纯 C ASAN 对照（精确复刻 Go 的调用路径）
      #
      # Go 的 runtime/asan 不走 __asan_report_store4，而是：
      #   __asan_region_is_poisoned -> __asan_report_error
      # 这两个入口和普通 C 插桩不同。这里用 no_sanitize 关闭编译器的
      # 自动插桩，手工调用同一对接口，参数和 runtime/asan/asan.go 一致。
      #
      # 判读（均为单线程，预期都正常）：
      #   实验 3 正常、实验 4 挂 -> libasan 的 __asan_report_error 入口问题
      #   实验 3 正常、实验 4 正常 -> 单线程报告路径本身没问题，需要并发
      #                              制造 VMA 变化才能复现（见实验 11-15）
      # ===================================================================
      - name: "实验 4: 纯 C ASAN 对照（复刻 __asan_region_is_poisoned + __asan_report_error）"
        continue-on-error: true
        run: |
          set -euxo pipefail
          LOG="$GITHUB_WORKSPACE/asan-logs/02-c-report-error.log"
          printf '%s\n' \
            '#include <stdlib.h>' \
            '#include <stdbool.h>' \
            '#include <sanitizer/asan_interface.h>' \
            '' \
            '/* 关闭本函数的自动插桩，手工调用 runtime/asan/asan.go 使用的同一对接口 */' \
            '__attribute__((no_sanitize("address")))' \
            'int main(void) {' \
            '    int *p = malloc(5 * sizeof(int));' \
            '    char *q = (char *)p + 20;' \
            '    if (__asan_region_is_poisoned(q, 4)) {' \
            '        __asan_report_error(__builtin_return_address(0), 0,' \
            '                            __builtin_frame_address(0), q, true, 4);' \
            '    }' \
            '    return 0;' \
            '}' > /tmp/asan-c-report-error.c
          gcc -fsanitize=address -g -O0 /tmp/asan-c-report-error.c -o /tmp/asan-c-report-error
          set +e
          timeout -s KILL 120 /tmp/asan-c-report-error > "$LOG" 2>&1
          code=$?
          set -e
          echo "exit=$code" | tee -a "$LOG"

      # ===================================================================
      # 实验 5-8：Go 相关实验（本阶段整体注释停用，恢复时取消注释）
      #
      # 第一阶段用它们证明了：
      #   - HEAD 和官方 Go 都会挂；
      #   - ASAN_OPTIONS 的 detect_leaks / symbolize / verbosity 都救不了；
      #   - 因此问题不在 fork，也不在 LSan/symbolizer flag。
      # 本阶段不再重复跑，省下时间做纯 C 复现的对照。
      # ===================================================================
      # -------------------------------------------------------------------
      # 实验 5：下载官方 Go
      # -------------------------------------------------------------------
      # - name: "实验 5: 下载官方 Go（bootstrap + 官方对照）"
      #   run: |
      #     set -euxo pipefail
      #     OFF=/tmp/go-official
      #     rm -rf "$OFF" /tmp/go /tmp/go.tar.gz
      #     for V in go1.26.4 go1.25.5 go1.25.0; do
      #       if curl -fsSL "https://go.dev/dl/${V}.linux-riscv64.tar.gz" -o /tmp/go.tar.gz; then
      #         echo "downloaded official ${V}"
      #         echo "${V}" > /tmp/official-version
      #         break
      #       fi
      #     done
      #     tar -C /tmp -xzf /tmp/go.tar.gz
      #     mv /tmp/go "$OFF"
      #     "$OFF/bin/go" version
      #
      # -------------------------------------------------------------------
      # 实验 6：用官方 Go 作 bootstrap 构建当前 HEAD 工具链
      # -------------------------------------------------------------------
      # - name: "实验 6: 用官方 Go 作为 bootstrap 构建 HEAD（make.bash）"
      #   continue-on-error: true
      #   run: |
      #     set -euxo pipefail
      #     OFF=/tmp/go-official
      #     cd "$GITHUB_WORKSPACE/src"
      #     rm -f "$GITHUB_WORKSPACE/VERSION"
      #     GOROOT_BOOTSTRAP="$OFF" GORISCV64=rva20u64 ./make.bash
      #     "$GITHUB_WORKSPACE/bin/go" version
      #
      # -------------------------------------------------------------------
      # 实验 7：用 HEAD 构建并单跑 asan2_fail
      # -------------------------------------------------------------------
      # - name: "实验 7: HEAD 构建并单跑 asan2_fail"
      #   continue-on-error: true
      #   run: |
      #     set -euxo pipefail
      #     GOROOT="$GITHUB_WORKSPACE"
      #     export GOROOT GORISCV64=rva20u64 CGO_ENABLED=1
      #     cd "$GOROOT/src"
      #     CGO_CFLAGS='-fsanitize=address -g' CGO_LDFLAGS='-fsanitize=address' \
      #       "$GOROOT/bin/go" build -asan -o /tmp/asan2_head \
      #       cmd/cgo/internal/testsanitizers/testdata/asan2_fail.go
      #
      #     LOG="$GITHUB_WORKSPACE/asan-logs/03-asan2_head.log"
      #     set +e
      #     timeout -s KILL 120 /tmp/asan2_head > "$LOG" 2>&1
      #     code=$?
      #     set -e
      #     echo "exit=$code" | tee -a "$LOG"
      #
      # -------------------------------------------------------------------
      # 实验 8：用官方 Go 构建并单跑同一份 asan2_fail
      # -------------------------------------------------------------------
      # - name: "实验 8: 官方 Go 构建并单跑同一份 asan2_fail"
      #   continue-on-error: true
      #   run: |
      #     set -euxo pipefail
      #     OFF=/tmp/go-official
      #     SRC="$GITHUB_WORKSPACE/src/cmd/cgo/internal/testsanitizers/testdata/asan2_fail.go"
      #     CGO_ENABLED=1 GOROOT="$OFF" GORISCV64=rva20u64 \
      #     CGO_CFLAGS='-fsanitize=address -g' CGO_LDFLAGS='-fsanitize=address' \
      #       "$OFF/bin/go" build -asan -o /tmp/asan2_official "$SRC"
      #
      #     LOG="$GITHUB_WORKSPACE/asan-logs/04-asan2_official.log"
      #     set +e
      #     timeout -s KILL 120 /tmp/asan2_official > "$LOG" 2>&1
      #     code=$?
      #     set -e
      #     echo "exit=$code" | tee -a "$LOG"

      # ===================================================================
      # 实验 11：编译纯 C 最小复现程序，并准备好统计脚本
      #
      # 思路：ASAN 报告路径的第一件事是符号化栈帧，而符号化会先刷新模块
      # 列表（读 /proc/self/maps）。如果读 maps 的过程中，进程里还有别的
      # 线程在 mmap/munmap，maps 文本就可能对不齐行，Next() 里的
      # CHECK_EQ(*data_.current++, '-') 就会失败；失败后 CheckFailed 又会
      # 在 CheckUnwind 里重入符号化器，而 mu_ 不可重入 -> 自死锁。
      #
      # 程序做两件事：
      #   1) 开若干 churn 线程，持续制造 VMA 增删：
      #      - mmap churn   ：反复 mmap/mprotect/munmap 不同大小的匿名映射
      #      - thread churn ：反复 pthread_create/join，制造 8MB 栈 VMA
      #   2) 主线程 malloc(20) 后写第 20 字节，触发 heap-buffer-overflow，
      #      从而进入 ASAN 的报告路径。
      #
      # 参数：argv[1]=mmap churn 线程数，argv[2]=thread churn 线程数
      #
      # 这里同时生成 /tmp/repro-lib.sh，供实验 12-15 复用统计逻辑。
      # ===================================================================
      - name: "实验 11: 编译纯 C 最小复现程序"
        run: |
          set -euxo pipefail
          cat > /tmp/asan-repro.c <<'EOF'
          /* 最小复现：ASAN 报告期间其它线程持续增删 VMA，
           * 触发 libasan 解析 /proc/self/maps 时的 CHECK 失败，
           * 随后在 CheckUnwind 中重入符号化器导致自死锁。
           *
           * 编译：gcc -fsanitize=address -g -O0 -pthread
           * 运行：./asan-repro <mmap_churn_threads> <thread_churn_threads>
           */
          #define _GNU_SOURCE
          #include <pthread.h>
          #include <stdatomic.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <sys/mman.h>
          #include <unistd.h>

          static atomic_int stop_flag;

          /* 常驻映射数量。libasan 的 ReadFileToBuffer 只有在 /proc/self/maps
           * 大于一页（4KB）时才会分多次 read()，而只有多次 read() 之间才
           * 存在“读到的文本对不齐行”的窗口。所以必须先把 maps 撑大。 */
          #define NR_PERSIST 200
          static void *persist[NR_PERSIST];

          /* 打印当前 /proc/self/maps 的规模，用来确认复现条件成立 */
          static void report_maps_size(const char *tag) {
              FILE *f = fopen("/proc/self/maps", "r");
              if (!f)
                  return;
              char buf[4096];
              size_t total = 0, lines = 0, n;
              while ((n = fread(buf, 1, sizeof buf, f)) > 0) {
                  total += n;
                  for (size_t i = 0; i < n; i++)
                      if (buf[i] == '\n')
                          lines++;
              }
              fclose(f);
              fprintf(stderr, "[repro] %s: maps lines=%zu bytes=%zu\n", tag, lines, total);
          }

          /* 反复 mmap / mprotect / munmap，制造匿名 VMA 增删 */
          static void *mmap_churn(void *arg) {
              uintptr_t id = (uintptr_t)arg;
              static const size_t sizes[] = { 4096, 65536, 1u << 20, 4u << 20 };
              unsigned i = (unsigned)id;
              while (!atomic_load_explicit(&stop_flag, memory_order_relaxed)) {
                  size_t sz = sizes[++i & 3];
                  void *p = mmap(NULL, sz, PROT_READ | PROT_WRITE,
                                 MAP_PRIVATE | MAP_ANONYMOUS, -1, 0);
                  if (p == MAP_FAILED)
                      continue;
                  *(volatile char *)p = 1;
                  if (i & 1)
                      mprotect(p, sz, PROT_READ);
                  munmap(p, sz);
              }
              return NULL;
          }

          static void *noop(void *arg) { (void)arg; return NULL; }

          /* 反复创建/销毁线程：每个线程 8MB 栈 VMA，让 maps 行数剧烈变化 */
          static void *thread_churn(void *arg) {
              (void)arg;
              while (!atomic_load_explicit(&stop_flag, memory_order_relaxed)) {
                  pthread_t t;
                  if (pthread_create(&t, NULL, noop, NULL) == 0)
                      pthread_join(t, NULL);
              }
              return NULL;
          }

          int main(int argc, char **argv) {
              int n_mmap = argc > 1 ? atoi(argv[1]) : 2;
              int n_thr = argc > 2 ? atoi(argv[2]) : 1;
              pthread_t th[64];
              int n = 0;

              atomic_init(&stop_flag, 0);

              /* 先把 maps 文件撑大。每个 8KB 映射后面跟一个 PROT_NONE 保护页，
               * 避免相邻 VMA 合并（保护属性不同则不会合并）。 */
              for (int i = 0; i < NR_PERSIST; i++) {
                  void *p = mmap(NULL, 8192, PROT_READ | PROT_WRITE,
                                 MAP_PRIVATE | MAP_ANONYMOUS, -1, 0);
                  if (p != MAP_FAILED) {
                      *(volatile char *)p = 1;
                      persist[i] = p;
                  }
                  mmap(NULL, 4096, PROT_NONE, MAP_PRIVATE | MAP_ANONYMOUS, -1, 0);
              }

              for (int i = 0; i < n_mmap && n < 64; i++)
                  pthread_create(&th[n++], NULL, mmap_churn, (void *)(uintptr_t)i);
              for (int i = 0; i < n_thr && n < 64; i++)
                  pthread_create(&th[n++], NULL, thread_churn, NULL);

              /* 让 churn 线程进入稳态，确保它们与报告线程并发 */
              usleep(200 * 1000);

              report_maps_size("before-overflow");

              /* 触发 heap-buffer-overflow：20 字节区间，写第 20..23 字节 */
              char *p = malloc(20);
              if (!p)
                  return 2;
              *(volatile int *)(p + 20) = 42;

              atomic_store(&stop_flag, 1);
              for (int i = 0; i < n; i++)
                  pthread_join(th[i], NULL);
              return 0;
          }
          EOF
          gcc -fsanitize=address -g -O0 -pthread /tmp/asan-repro.c -o /tmp/asan-repro
          # 冒烟：不带 churn 跑一次，只确认程序能编译、能触发 ASAN 报告
          set +e
          timeout -s KILL 60 /tmp/asan-repro 0 0 > /tmp/repro-smoke.out 2>&1
          smoke=$?
          set -e
          echo "smoke exit=$smoke"
          grep -E 'ERROR: AddressSanitizer|SUMMARY: AddressSanitizer' /tmp/repro-smoke.out || true

          # 统计脚本：run_repro <tag> <mmap_churn> <thread_churn> <runs>
          # 本板较慢，单次超时给到 60s。
          cat > /tmp/repro-lib.sh <<'EOF'
          run_repro() {
            local tag="$1" nm="$2" nt="$3" runs="$4"
            local log="$GITHUB_WORKSPACE/asan-logs/05-repro-${tag}.log"
            local ok=0 hang=0 chk=0 other=0 i code
            : > "$log"
            for i in $(seq 1 "$runs"); do
              set +e
              timeout -s KILL 60 /tmp/asan-repro "$nm" "$nt" > /tmp/repro-run.out 2>&1
              code=$?
              set -e
              if grep -q 'CHECK failed' /tmp/repro-run.out; then
                chk=$((chk + 1))
              fi
              if [ "$code" -eq 137 ] || [ "$code" -eq 124 ]; then
                hang=$((hang + 1))
              elif [ "$code" -eq 1 ] && grep -q 'SUMMARY: AddressSanitizer' /tmp/repro-run.out; then
                ok=$((ok + 1))
              else
                other=$((other + 1))
              fi
              {
                echo "--- run ${i} exit=${code} ---"
                tail -25 /tmp/repro-run.out
              } >> "$log"
            done
            local line="tag=${tag} mmap_churn=${nm} thread_churn=${nt} runs=${runs} ok=${ok} hang=${hang} check_failed=${chk} other=${other}"
            echo "$line" | tee -a "$log"
            echo "$line" >> "$GITHUB_WORKSPACE/asan-logs/06-repro-summary.log"
          }
          EOF

      # ===================================================================
      # 实验 12：复现实验 - 无 churn 对照组
      #
      # 预期：全部 ok（exit=1 且打印 SUMMARY），0 次 hang。
      # 如果这一组也失败，说明复现条件不成立，实验 13-15 的结论无效。
      # ===================================================================
      - name: "实验 12: 复现实验 - 无 churn 对照组"
        continue-on-error: true
        run: |
          set -euxo pipefail
          source /tmp/repro-lib.sh
          run_repro nochurn 0 0 3

      # ===================================================================
      # 实验 13：复现实验 - mmap/munmap churn
      #
      # 用 2 个线程持续 mmap/mprotect/munmap。
      # 若出现 hang / check_failed，说明单独的匿名 VMA 增删就足以触发。
      # ===================================================================
      - name: "实验 13: 复现实验 - mmap/munmap churn"
        continue-on-error: true
        run: |
          set -euxo pipefail
          source /tmp/repro-lib.sh
          run_repro mmap 2 0 5

      # ===================================================================
      # 实验 14：复现实验 - 线程创建/销毁 churn
      #
      # 2 个线程不断 pthread_create/join。每次线程创建/退出都会
      # mmap/munmap 一段 8MB 栈，是让 maps 文本行数整体挪动最剧烈的来源。
      # ===================================================================
      - name: "实验 14: 复现实验 - 线程创建/销毁 churn"
        continue-on-error: true
        run: |
          set -euxo pipefail
          source /tmp/repro-lib.sh
          run_repro thread 0 2 5

      # ===================================================================
      # 实验 15：复现实验 - 两种 churn 叠加
      #
      # 2 个 mmap churn + 2 个 thread churn，最接近 Go 程序运行时的环境。
      # RISE 上这一组预期失败率最高；本板作为对照，预期全过。
      # ===================================================================
      - name: "实验 15: 复现实验 - 两种 churn 叠加"
        continue-on-error: true
        run: |
          set -euxo pipefail
          source /tmp/repro-lib.sh
          run_repro both 2 2 5

      # ===================================================================
      # 实验 16：Go 侧控制变量（本板作为对照）
      #
      # 与 RISE 上的实验 16 完全相同，只是次数减半。要点：
      #   - 本机 libasan 是 GCC 8.4（libasan.so.8），它的
      #     ReadFileToBuffer 每次 read 只请求一页，且 read 失败时
      #     不清理指针；GCC 9 才加上失败清理。
      #   - 因此除了"VMA 并发变化"，还要排除 Go 运行时信号打断
      #     read() 这一条路径。
      #
      # 对照组：
      #   baseline  默认
      #   noasync   GODEBUG=asyncpreemptoff=1
      #   gomax1    GOMAXPROCS=1
      # ===================================================================
      - name: "实验 16: Go 侧控制变量（异步抢占 / 线程数）"
        continue-on-error: true
        run: |
          set -euxo pipefail
          LOGDIR="$GITHUB_WORKSPACE/asan-logs"

          cd "$GITHUB_WORKSPACE/src"

          # 取构建用的 Go：优先本仓库刚编译出来的 bin/go；实验 5-8 被
          # 注释掉之后它并不存在，这时退回 runner 上预装的 go。两者都能
          # 复现（此前的实验 8 已确认官方 Go 同样会挂），对定位 libasan
          # 的问题没有影响。
          if [ -x "$GITHUB_WORKSPACE/bin/go" ]; then
            GO_BIN="$GITHUB_WORKSPACE/bin/go"
            export GOROOT="$GITHUB_WORKSPACE"
          elif command -v go >/dev/null 2>&1; then
            GO_BIN="$(command -v go)"
          else
            # RISE runner 上既没有本仓库编译出的 bin/go，也没有系统 go。
            # 退回官方 riscv64 发行包作为构建工具。实验 8 已经确认过：
            # 官方 Go 构建出来的 asan2_fail 同样会触发本问题，因此用它
            # 不影响这一轮的判断（要测的是 libasan 读取路径 + 环境变量）。
            OFF=/tmp/go-official
            if [ ! -x "$OFF/bin/go" ]; then
              rm -rf "$OFF" /tmp/go /tmp/go.tar.gz
              got=0
              for V in go1.26.4 go1.25.5 go1.25.0; do
                if curl -fsSL --max-time 300 \
                     "https://go.dev/dl/${V}.linux-riscv64.tar.gz" \
                     -o /tmp/go.tar.gz; then
                  echo "downloaded official ${V}" >&2
                  got=1
                  break
                fi
              done
              if [ "$got" -ne 1 ]; then
                echo "download official go failed; skip 实验 16" \
                  | tee "$LOGDIR/07-env.log"
                exit 0
              fi
              tar -C /tmp -xzf /tmp/go.tar.gz
              rm -rf "$OFF"
              mv /tmp/go "$OFF"
            fi
            GO_BIN="$OFF/bin/go"
            export GOROOT="$OFF"
          fi

          export GORISCV64=rva20u64 CGO_ENABLED=1
          CGO_CFLAGS='-fsanitize=address -g' CGO_LDFLAGS='-fsanitize=address' \
            "$GO_BIN" build -asan -o /tmp/asan2_head \
            "$GITHUB_WORKSPACE/src/cmd/cgo/internal/testsanitizers/testdata/asan2_fail.go"

          {
            echo "nproc=$(nproc)"
            echo "PAGE_SIZE=$(getconf PAGE_SIZE)"
            gcc --version | head -1
            ldd /tmp/asan2_head | grep -i asan || true
          } | tee "$LOGDIR/07-env.log"

          cat > /tmp/asan2-lib.sh <<'EOF'
          run_asan2() {
            local tag="$1" runs="$2"; shift 2
            local log="$GITHUB_WORKSPACE/asan-logs/08-asan2-${tag}.log"
            local ok=0 hang=0 chk=0 other=0 i code
            : > "$log"
            for i in $(seq 1 "$runs"); do
              set +e
              env "$@" timeout -s KILL 20 /tmp/asan2_head > /tmp/asan2-run.out 2>&1
              code=$?
              set -e
              grep -q 'CHECK failed' /tmp/asan2-run.out && chk=$((chk + 1))
              if [ "$code" -eq 137 ] || [ "$code" -eq 124 ]; then
                hang=$((hang + 1))
              elif [ "$code" -eq 1 ] && grep -q 'SUMMARY: AddressSanitizer' /tmp/asan2-run.out; then
                ok=$((ok + 1))
              else
                other=$((other + 1))
              fi
              {
                echo "--- run ${i} exit=${code} ---"
                tail -6 /tmp/asan2-run.out
              } >> "$log"
            done
            local line="tag=${tag} runs=${runs} ok=${ok} hang=${hang} check_failed=${chk} other=${other} env=[$*]"
            echo "$line" | tee -a "$log"
            echo "$line" >> "$GITHUB_WORKSPACE/asan-logs/09-asan2-summary.log"
          }
          EOF

          source /tmp/asan2-lib.sh
          run_asan2 baseline 5
          run_asan2 noasync  5 GODEBUG=asyncpreemptoff=1
          run_asan2 gomax1   5 GOMAXPROCS=1

      # ===================================================================
      # 实验 17：strace 观察 read(/proc/self/maps)
      #
      # 与 RISE 上一致；本板预期复现不出来，日志用于对照 read 序列。
      # ===================================================================
      - name: "实验 17: strace 观察 read(/proc/self/maps)"
        continue-on-error: true
        run: |
          set -euxo pipefail
          LOGDIR="$GITHUB_WORKSPACE/asan-logs"
          if [ ! -x /tmp/asan2_head ]; then
            echo "asan2_head missing (实验 16 构建失败); skip" | tee "$LOGDIR/10-strace.log"
            exit 0
          fi
          if ! command -v strace >/dev/null 2>&1; then
            echo "strace not installed; skip" | tee "$LOGDIR/10-strace.log"
            exit 0
          fi
          : > "$LOGDIR/10-strace.log"
          for i in 1 2 3; do
            set +e
            strace -f -e trace=openat,open,read,close -o /tmp/asan2.strace \
              timeout -s KILL 20 /tmp/asan2_head > /tmp/asan2-strace.out 2>&1
            code=$?
            set -e
            {
              echo "===== run $i exit=$code ====="
              if grep -q 'CHECK failed' /tmp/asan2-strace.out; then
                echo "check_failed=yes"
              fi
              awk -v want=0 '
                /open.*"\/proc\/self\/maps"/ { want=1; print "----- maps open -----" }
                want { print }
                want && /close\(/ { want=0; print "----- maps close -----" }
              ' /tmp/asan2.strace | tail -60
            } >> "$LOGDIR/10-strace.log"
            if grep -q 'CHECK failed' /tmp/asan2-strace.out; then
              echo "reproduced on run $i" | tee -a "$LOGDIR/10-strace.log"
              break
            fi
          done

      # ===================================================================
      # 实验 9：汇总关键结果
      # ===================================================================
      - name: "实验 9: 汇总结果"
        if: always()
        run: |
          set -x
          shopt -s nullglob
          for f in "$GITHUB_WORKSPACE"/asan-logs/*.log; do
            echo "========== $f =========="
            grep -E 'exit=|case=|tag=|ERROR: AddressSanitizer|SUMMARY: AddressSanitizer|CHECK failed|DEADLYSIGNAL|heap-buffer-overflow|heap-use-after-free|use-after-poison|=== RUN|--- PASS|--- FAIL|--- SKIP|panic:' "$f" | tail -30 || true
          done

      # ===================================================================
      # 实验 10：上传日志（无论成功失败都上传）
      # ===================================================================
      - name: "实验 10: 上传日志"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asan-logs-milkv-pioneer
          path: asan-logs/
          if-no-files-found: ignore
