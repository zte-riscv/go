name: all.bash in RISE-runner
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-toolchain-in-rise-runner:
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 300
    env:
      # 跳过 TestASAN。
      #
      # 这台 runner（riscv64 / 4 核 / Linux 5.10）上 libasan 在打印报告时
      # 会挂死：它一边解析 /proc/self/maps 一边被别的线程改动 VMA，
      # 解析器走到 CHECK_EQ(*data_.current++, '-')
      # （sanitizer_procmaps_linux.cpp:42）失败；随后 CheckFailed ->
      # CheckUnwind -> SymbolizePC 再次抢同一把不可重入的 symbolizer 锁，
      # 自死锁，进程永远不退出，最后被包超时杀掉。
      #
      # 用官方 Go 工具链同样能复现，不是本仓库的问题，所以这里直接跳过。
      # 开关由 src/cmd/cgo/internal/testsanitizers/asan_test.go 里的
      # skipASANOnRiscv64 读取，只在 GOARCH=riscv64 时生效。
      GOTEST_SKIP_ASAN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure C toolchain is available
        run: |
            set -euxo pipefail
            if ! command -v gcc >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends gcc libc6-dev
            fi
            gcc --version

      - name: Build toolchain (host riscv64)
        run: |
            # install bootstrap Go
            set -euxo pipefail
            BOOT=/tmp/go-bootstrap
            rm -rf "$BOOT"
            curl -fsSL https://github.com/zte-riscv/go/releases/download/go1.26.4.202607/go1.26.4.202607.linux-riscv64.tar.gz -o /tmp/go.tar.gz
            tar -C /tmp -xzf /tmp/go.tar.gz
            mv /tmp/go "$BOOT"
            export GOROOT_BOOTSTRAP="$BOOT"
            export GORISCV64=rva20u64,misaligned_fast
            export GO_TEST_TIMEOUT_SCALE=10

            # build toolchain
            cd "$GITHUB_WORKSPACE/src"
            rm -f "$GITHUB_WORKSPACE/VERSION"
            ./all.bash
